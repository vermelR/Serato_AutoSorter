[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: fast isolated logic test
    integration: temporary-file end-to-end workflow test
    streamlit: Streamlit AppTest interface/state test
    writer: Serato binary writer or parser test
    prediction: model loading or prediction pipeline test
    watcher: watcher queue/state test
    onboarding: first-launch or setup-state test
    training: personalized dataset, training, or evaluation test
    cache: feature-cache behavior test
    model_store: candidate/active model lifecycle test
    model_health: model health or feedback summary test
    metadata: offline-first metadata/provider behavior test
    model_quality: reproducible model-quality artifact or history test
    metrics: multi-label or ranking metric calculation test
    leakage: split ownership or data-leakage prevention test
    calibration: calibration or reliability metric test
    thresholds: validation-only threshold selection or prediction threshold test
    candidate_comparison: champion-challenger comparison or quality-gate test
    performance: M6 performance or bounded-work regression test
    model_storage: compact/versioned model persistence and retention test
    model_size: model artifact budget and oversized-model test
    incremental_scan: incremental crate/music index behavior test
    background_jobs: background progress, cancellation, or checkpoint test
    batch_prediction: batch/individual inference equivalence test
    migration: legacy compatibility or compact migration test
    slow: deliberately slower test; excluded from the fast suite
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
